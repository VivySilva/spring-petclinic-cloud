# =====================================================================
# 1. BANCO DE DADOS: CUSTOMERS SERVICE
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql-customers
  namespace: spring-petclinic
spec:
  selector:
    app: mysql-customers
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-customers
  namespace: spring-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-customers
  template:
    metadata:
      labels:
        app: mysql-customers
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - customers-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - "--default-authentication-plugin=mysql_native_password"
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: service_instance_db
            - name: MYSQL_USER
              value: petclinic
            - name: MYSQL_PASSWORD
              value: petclinic
          ports:
            - containerPort: 3306

---
